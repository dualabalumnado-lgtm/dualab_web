services:

  # ──────────────────────────────────────────
  # MySQL 8
  # ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: dualabweb_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-dualabweb}
      MYSQL_USER: ${DB_USERNAME:-dualab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dualabweb

  # ──────────────────────────────────────────
  # Laravel — PHP-FPM (solo red interna)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dualabweb_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dualabweb}
      DB_USERNAME: ${DB_USERNAME:-dualab}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db
    networks:
      - dualabweb

  # ──────────────────────────────────────────
  # Vue 3 — Vite dev server (solo red interna)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dualabweb_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dualabweb

  # ──────────────────────────────────────────
  # Nginx — único entrypoint
  #   http://localhost       → Vue SPA + HMR
  #   http://localhost/api/  → Laravel
  # ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dualabweb_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - dualabweb

volumes:
  db_data:

networks:
  dualabweb:
    driver: bridge
